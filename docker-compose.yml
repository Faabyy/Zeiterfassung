services:
  db:
    image: postgres:17-alpine
    container_name: zeiterfassung-db
    restart: unless-stopped
    environment:
      # Werte kommen aus der .env (Vorlage: .env.example).
      POSTGRES_DB: ${POSTGRES_DB:?in .env setzen}
      POSTGRES_USER: ${POSTGRES_USER:?in .env setzen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?in .env setzen}
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    ports:
      # Nur lokal erreichbar, nicht aus dem Netzwerk.
      - "127.0.0.1:${POSTGRES_PORT:?in .env setzen}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Das Schema legt das Backend beim Start an (backend/migrations/).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
